<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <audio id="Muzic" controls src="bensound-angelsbymyside.mp3">
    <Canvas id="Bars"></Canvas>

    <div id = "Album">
        <img id = "AlbumCover" src="" alt="Album Cover">
    </div>
    <div id = "SongInfo">
        <h1 id = "SongName">Not PLaying</h1> 
        <p id = "ArtistName">Not Playing</p>
    </div>


    <div id = "Controls">
        <button id = "Previous" onclick="previousSong()">Previous</button>
        <button id = "PlayPause" onclick="togglePlayPause()">Play</button>
        <button id = "Next" onclick="nextSong()">Next</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
