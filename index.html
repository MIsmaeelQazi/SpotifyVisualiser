<!DOCTYPE html>
<html lang="en">
<head>
    <link href = "https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="CreepyOverlay"></div>
    <Canvas id="Bars"></Canvas>
    <div id="UILayer">
        <header id="MadeBy">
            <span class="name">Audio Visualizer</span>
            <span class="WhatIsIt">Arcane Themed</span>
        </header>
        <main id="Center">
            <button id="Start" onclick="startVisualizer()">Audio Sync</button>
        </main>
        <footer id="HowToUse">
            <div class="Controls">
                <span class="key">1</span>
                <span class="key">2</span>
                <span class="key">3</span>
                <span class="Description">Arcane Themed / Ambient/ Aggressive</span>
            </div>
            <div class="WhiteSpace"></div>
            <div class = "Controls">
                <span class="key">&larr;</span>
                <span class="key">&rarr;</span>
                <span class="Description">Sub-Themes</span>
            </div>
            <div class="WhiteSpace"></div>
            <div class="Controls">
                <span class="key">&uarr;</span>
                <span class="key">&darr;</span>
                <span class="Description">Bars/ Circle</span>
            </div>

        </footer>

    </div>
    <script src="script.js"></script>
    
</body>
</html>
